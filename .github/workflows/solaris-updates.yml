name: SolarisPKN-Updates - feed policy and Windows compatibility

on:
  push:
    paths:
      - "solarispkn-updates/**"
      - "solarispkn-paste/src/**"
      - ".github/workflows/solaris-updates.yml"
  pull_request:
    paths:
      - "solarispkn-updates/**"
      - "solarispkn-paste/src/**"
      - ".github/workflows/solaris-updates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feed-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate stable and sample candidate feeds
        run: |
          python3 solarispkn-updates/tools/validate_manifest.py solarispkn-updates/channels/stable.json
          python3 solarispkn-updates/tools/validate_manifest.py solarispkn-updates/channels/candidate.example.json
      - name: Negative gates fail closed
        run: |
          python3 - <<'PY'
          import copy, json, tempfile
          from pathlib import Path
          import sys
          sys.path.insert(0, 'solarispkn-updates/tools')
          from validate_manifest import validate
          original = json.loads(Path('solarispkn-updates/channels/candidate.example.json').read_text())
          item = original['products'][0]['releases'][0]
          item['approved'] = True
          item['validation'] = {
              'passed': True, 'runId': 1, 'sourceSha': 'a' * 40}
          item['asset']['sha256'] = 'b' * 64
          for patch in (
              {'url': 'https://not-github.invalid/bad.exe'},
              {'sha256': '0'},
              {'minOsBuild': -1},
              {'architecture': 'mips'},
          ):
              current = copy.deepcopy(original)
              current['products'][0]['releases'][0]['asset'].update(patch)
              with tempfile.TemporaryDirectory() as td:
                  path = Path(td)/'candidate.json'
                  path.write_text(json.dumps(current))
                  try:
                      validate(path, stable=False)
                  except ValueError:
                      continue
                  raise SystemExit('Unsafe candidate unexpectedly accepted: '+str(patch))
          print('REJECTION_POLICY_PASS')
          PY

  windows-module:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build independent updater and integrated Paste
        shell: pwsh
        run: |
          dotnet restore solarispkn-paste/src/SolarisPKN.Paste.csproj
          dotnet build solarispkn-paste/src/SolarisPKN.Paste.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test versioning, OS compatibility, approval, origin and schedule policy
        shell: pwsh
        run: |
          dotnet solarispkn-paste/src/bin/Release/net10.0-windows/SolarisPKN-Paste.dll --updates-selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
