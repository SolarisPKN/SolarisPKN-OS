# Yocto Scarthgap layer skeleton; no installable recipes yet.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "solarispknverity"
BBFILE_PATTERN_solarispknverity = "^${LAYERDIR}/"
BBFILE_PRIORITY_solarispknverity = "6"
LAYERSERIES_COMPAT_solarispknverity = "scarthgap"
